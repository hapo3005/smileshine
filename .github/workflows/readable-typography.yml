name: Readable typography QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Check desktop, iPhone and iPad layouts
        run: |
          QA_LOCAL=1 npx playwright test tests/readable-typography.spec.js --config=playwright.config.js --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readable-typography-screenshots
          path: test-results
