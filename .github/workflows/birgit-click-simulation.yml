name: Birgit 30 real-click admin simulations
on:
  push:
    branches: [main]
    paths: ["tests/birgit-click-simulation.spec.js", ".github/workflows/birgit-click-simulation.yml", "admin*.js", "admin*.css", "admin.html", "studio*.js"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: birgit-click-simulation
  cancel-in-progress: true
jobs:
  simulate:
    name: Birgit · ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: desktop
            browser: chromium
          - profile: iphone
            browser: webkit
          - profile: ipad
            browser: webkit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BIRGIT_PROFILE: ${{ matrix.profile }}
      QA_BASE_URL: https://hapo3005.github.io/smileshine/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Execute real click journeys
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: birgit-results-${{ matrix.profile }}.json
        run: npx playwright test tests/birgit-click-simulation.spec.js --browser=${{ matrix.browser }} --workers=2 --retries=0 --reporter=line,json
      - name: Store results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birgit-simulation-${{ matrix.profile }}
          path: |
            birgit-results-*.json
            test-results/
          if-no-files-found: warn
