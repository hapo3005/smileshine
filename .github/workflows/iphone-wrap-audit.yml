name: iPhone text wrapping audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wrap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --no-save @playwright/test http-server
          npx playwright install --with-deps chromium
      - run: npx playwright test tests/iphone-wrap-audit.spec.js --config=playwright.config.cjs --reporter=line
