name: Cross-platform device QA

concurrency:
  group: smileshine-cross-platform
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "admin.html"
      - "styles.css"
      - "booking.css"
      - "booking-advanced.css"
      - "admin.css"
      - "admin-*.css"
      - "admin-*.js"
      - "script.js"
      - "booking-admin-sync.js"
      - "checkout-enhancements.js"
      - "cnc-products-carousel.js"
      - "tests/cross-platform.spec.js"
      - ".github/workflows/cross-platform-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
            profile: desktop
            slug: linux-chromium-desktop
            label: Linux · Chromium · Desktop
          - os: ubuntu-latest
            browser: chromium
            profile: android
            slug: android-chromium
            label: Android profile · Chromium
          - os: windows-latest
            browser: chromium
            profile: desktop
            slug: windows-chromium-desktop
            label: Windows · Chromium · Desktop
          - os: windows-latest
            browser: firefox
            profile: desktop
            slug: windows-firefox-desktop
            label: Windows · Firefox · Desktop
          - os: macos-latest
            browser: chromium
            profile: desktop
            slug: macos-chromium-desktop
            label: macOS · Chromium · Desktop
          - os: macos-latest
            browser: webkit
            profile: desktop
            slug: macos-webkit-desktop
            label: macOS · WebKit · Desktop
          - os: macos-latest
            browser: webkit
            profile: iphone
            slug: iphone-webkit
            label: iPhone profile · WebKit
          - os: macos-latest
            browser: webkit
            profile: ipad
            slug: ipad-webkit
            label: iPad profile · WebKit

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Install browser and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install browser
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.browser }}

      - name: Run cross-platform smoke suite
        env:
          PW_BROWSER: ${{ matrix.browser }}
          QA_PROFILE: ${{ matrix.profile }}
          QA_LABEL: ${{ matrix.label }}
        run: npx playwright test tests/cross-platform.spec.js --reporter=line --workers=1

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-${{ matrix.slug }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

