name: Live booking + responsive E2E

concurrency:
  group: smileshine-live-e2e
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "admin.html"
      - "styles.css"
      - "booking.css"
      - "booking-advanced.css"
      - "admin.css"
      - "admin-calendar-views.css"
      - "admin-calendar-workspace.js"
      - "admin-calendar-workspace.css"
      - "admin-customer-detail.js"
      - "admin-customer-detail.css"
      - "admin-customer-numbers.js"
      - "admin-payments.css"
      - "admin-services-manager.js"
      - "admin-services-manager.css"
      - "script.js"
      - "admin.js"
      - "admin-appointment-detail.js"
      - "admin-appointment-detail.css"
      - "booking-admin-sync.js"
      - "checkout-enhancements.js"
      - "tests/live-booking.spec.js"
      - "tests/responsive.spec.js"
      - "tests/admin-appointment-detail.spec.js"
      - "tests/admin-calendar-workspace.spec.js"
      - "tests/admin-customer-workspace.spec.js"
      - ".github/workflows/live-booking-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-booking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages version
        run: |
          for attempt in {1..30}; do
            if curl -fsSL "https://hapo3005.github.io/smileshine/index.html?run=$GITHUB_RUN_ID" | grep -q "20260922-admin-unified4"; then
              exit 0
            fi
            sleep 10
          done
          echo "Published page did not reach expected version in time."
          exit 1

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Test published site in Chromium
        run: npx playwright test tests/live-booking.spec.js tests/responsive.spec.js tests/admin-appointment-detail.spec.js tests/admin-calendar-workspace.spec.js tests/admin-customer-workspace.spec.js --reporter=line

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsive-diagnostics
          path: test-results
          if-no-files-found: ignore
