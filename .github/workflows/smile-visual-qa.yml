name: Smile & Shine visual QA

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'review/**'
      - 'review-v73.css'
      - 'booking.css'
      - 'booking-advanced.css'
      - 'studio-config.js'
      - 'studio-content.js'
      - 'studio-data-store.js'
      - 'script.js'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/smile-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA runtime
        run: |
          npm install --no-save @playwright/test http-server
          npx playwright install --with-deps chromium
      - name: Run responsive and booking checks
        run: npx playwright test
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smile-shine-visual-qa
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
